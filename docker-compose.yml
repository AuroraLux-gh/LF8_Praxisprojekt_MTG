services:

  db:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mauer137
      MYSQL_DATABASE: mtg_db
      MYSQL_USER: lux
      MYSQL_PASSWORD: mauer137
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql   # ← wird beim ersten Start automatisch ausgeführt
      - mariadb_data:/var/lib/mysql                        # ← Daten bleiben erhalten
    #ports:
      #- "3306:3306"W
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: spring-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy    # ← wartet bis DB wirklich bereit ist
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/mtg_db
      SPRING_DATASOURCE_USERNAME: lux
      SPRING_DATASOURCE_PASSWORD: mauer137
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver

volumes:
  mariadb_data:
